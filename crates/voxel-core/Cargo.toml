[package]
name = "voxel-core"
version = "0.1.0"
edition = "2021"
description = "Chunk mesher for Blockfall Isle, compiled to WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.104"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
